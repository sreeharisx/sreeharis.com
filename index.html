<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sreehari</title>
<meta name="description" content="Sreehari — i@sreeharis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --bg-raised: #101312;
    --panel: #0d100e;
    --fg: #dde3dd;
    --fg-dim: #5b665c;
    --fg-dimmer: #333a34;
    --amber: #ffb454;
    --amber-soft: rgba(255,180,84,0.12);
    --amber-dim: #7a5a2c;
    --line: #1c211d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  @media (hover: none) {
    body { cursor: auto; }
  }

  /* ---------- particle canvas ---------- */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .glow {
    position: fixed;
    top: -10%;
    left: 50%;
    translate: -50%;
    width: 900px;
    height: 500px;
    background: radial-gradient(closest-side, rgba(255,180,84,0.10), transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- custom cursor ---------- */
  .cursor-dot, .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    transform: translate(-50%, -50%);
  }
  .cursor-dot {
    width: 6px;
    height: 6px;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }
  .cursor-ring {
    width: 34px;
    height: 34px;
    border: 1px solid var(--amber-dim);
    transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
  }
  .cursor-ring.active {
    width: 54px;
    height: 54px;
    border-color: var(--amber);
  }
  @media (hover: none) {
    .cursor-dot, .cursor-ring { display: none; }
  }

  main { position: relative; z-index: 1; }

  /* ---------- top status bar ---------- */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.6rem 1.5rem 0;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: rise 0.6s ease-out 2.6s forwards;
  }
  .statusbar .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5fbf77;
    margin-right: 0.5em;
    box-shadow: 0 0 6px #5fbf77;
    animation: pulse 2.4s ease-in-out infinite;
  }

  /* ---------- hero ---------- */
  .hero {
    min-height: 88vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    will-change: transform;
  }

  .welcome {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-bottom: 0.9rem;
    opacity: 0;
    transform: translateX(-40px);
    animation: slide-in 1.1s ease-out 0.1s forwards;
  }

  .avatar-wrap {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin-bottom: 1.6rem;
    opacity: 0;
    position: relative;
    animation: rise 0.5s ease-out 1s forwards;
  }
  .avatar-wrap::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid var(--amber-dim);
    animation: spin 12s linear infinite;
    border-top-color: var(--amber);
    border-right-color: transparent;
  }
  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
    filter: grayscale(0.25) contrast(1.05);
    display: block;
  }

  h1 {
    font-size: clamp(3rem, 11vw, 5.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    opacity: 0;
    animation: rise 0.5s ease-out 1.4s forwards;
    position: relative;
  }
  h1 .glitch-layer {
    position: absolute;
    inset: 0;
    color: var(--amber);
    clip-path: inset(0 0 100% 0);
    pointer-events: none;
  }
  h1.glitching .glitch-layer {
    animation: glitch-slice 0.5s steps(2, end) 1;
  }
  h1 .cursor {
    display: inline-block;
    width: 0.45ch;
    margin-left: 0.15em;
    background: var(--amber);
    color: var(--amber);
    animation: blink 1s step-end infinite 1.9s;
  }

  .tagline {
    margin-top: 1rem;
    color: var(--fg-dim);
    font-size: 0.95rem;
    max-width: 40ch;
    opacity: 0;
    animation: rise 0.5s ease-out 1.8s forwards;
  }
  .tagline .amber { color: var(--amber-dim); }

  .scroll-cue {
    margin-top: 3rem;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 0.6em;
    opacity: 0;
    animation: rise 0.5s ease-out 2.2s forwards;
  }
  .scroll-cue::after {
    content: "";
    width: 1px;
    height: 22px;
    background: linear-gradient(var(--amber-dim), transparent);
    animation: drop 1.6s ease-in-out infinite;
  }

  /* ---------- connect section ---------- */
  .connect {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  .section-label {
    font-size: 0.7rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8em;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .section-label.visible { opacity: 1; transform: translateY(0); }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .cards {
    display: grid;
    gap: 0.9rem;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    padding: 1.3rem 1.4rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    text-decoration: none;
    color: var(--fg);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    opacity: 0;
    transform: translateY(20px);
  }
  .card.visible {
    animation: rise 0.6s ease-out forwards;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 50%), var(--amber-soft), transparent 70%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--amber-dim);
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card:focus-visible { outline: 1px solid var(--amber-dim); outline-offset: 2px; }

  .card .icon {
    font-size: 1.1rem;
    color: var(--amber);
    width: 1.6rem;
    text-align: center;
    z-index: 1;
  }
  .card .text { z-index: 1; }
  .card .label {
    font-size: 0.68rem;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .card .value {
    font-size: 1rem;
    font-weight: 500;
  }
  .card .arrow {
    margin-left: auto;
    color: var(--fg-dimmer);
    z-index: 1;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .card:hover .arrow, .card:focus-visible .arrow {
    color: var(--amber);
    transform: translateX(3px);
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.03em;
    border-top: 1px solid var(--line);
  }
  footer div { padding-top: 1.5rem; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }
  @keyframes glitch-slice {
    0% { clip-path: inset(10% 0 80% 0); transform: translate(-3px); }
    25% { clip-path: inset(60% 0 10% 0); transform: translate(3px); }
    50% { clip-path: inset(30% 0 50% 0); transform: translate(-2px); }
    75% { clip-path: inset(70% 0 5% 0); transform: translate(2px); }
    100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  }

  @media (max-width: 480px) {
    .statusbar { font-size: 0.6rem; }
    .card { padding: 1.1rem 1.1rem; gap: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .tagline, .scroll-cue, footer, .avatar-wrap, .welcome, .statusbar {
      animation: none !important; opacity: 1 !important; transform: none !important;
    }
    .statusbar .dot, .scroll-cue::after, .avatar-wrap::before { animation: none !important; }
    .section-label, .card { opacity: 1 !important; transform: none !important; }
    body { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="glow"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<main>
  <div class="statusbar">
    <span><span class="dot"></span>online</span>
    <span>sreeharis.com</span>
  </div>

  <section class="hero">
    <div class="welcome">Welcome</div>
    <div class="avatar-wrap">
      <img class="avatar" src="sreehari.jpg" alt="Sreehari">
    </div>
    <h1 id="glitchName">Sreehari<span class="glitch-layer" aria-hidden="true">Sreehari</span><span class="cursor">&nbsp;</span></h1>
    <p class="tagline">Personal corner of the internet at <span class="amber">sreeharis.com</span>.</p>
    <div class="scroll-cue">connect</div>
  </section>

  <section class="connect">
    <div class="section-label">reach me</div>
    <div class="cards">
      <a class="card" href="mailto:i@sreeharis.com">
        <span class="icon">@</span>
        <span class="text">
          <span class="label">email</span>
          <span class="value">i@sreeharis.com</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="card" href="https://instagram.com/realsreeharis" target="_blank" rel="noopener noreferrer">
        <span class="icon">#</span>
        <span class="text">
          <span class="label">instagram</span>
          <span class="value">@realsreeharis</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </section>

  <footer>
    <div>&copy; 2026 Sreehari</div>
    <div id="liveClock">--:--:--</div>
  </footer>
</main>

<script>
(function() {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- custom cursor ---------- */
  if (!reduceMotion && matchMedia('(hover: hover)').matches) {
    var dot = document.querySelector('.cursor-dot');
    var ring = document.querySelector('.cursor-ring');
    var rx = 0, ry = 0, mx = 0, my = 0;
    window.addEventListener('mousemove', function(e) {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top = my + 'px';
    });
    (function loop() {
      rx += (mx - rx) * 0.15;
      ry += (my - ry) * 0.15;
      ring.style.left = rx + 'px';
      ring.style.top = ry + 'px';
      requestAnimationFrame(loop);
    })();
    document.querySelectorAll('a, .card').forEach(function(el) {
      el.addEventListener('mouseenter', function() { ring.classList.add('active'); });
      el.addEventListener('mouseleave', function() { ring.classList.remove('active'); });
    });
  }

  /* ---------- magnetic cards ---------- */
  document.querySelectorAll('.card').forEach(function(card) {
    card.addEventListener('mousemove', function(e) {
      var r = card.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mx', x + 'px');
      card.style.setProperty('--my', y + 'px');
      if (!reduceMotion) {
        var dx = (x - r.width / 2) * 0.04;
        var dy = (y - r.height / 2) * 0.15;
        card.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      }
    });
    card.addEventListener('mouseleave', function() {
      card.style.transform = 'translate(0,0)';
    });
  });

  /* ---------- scroll reveal ---------- */
  var revealEls = document.querySelectorAll('.section-label, .card');
  if ('IntersectionObserver' in window && !reduceMotion) {
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry, i) {
        if (entry.isIntersecting) {
          setTimeout(function() { entry.target.classList.add('visible'); }, i * 90);
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    revealEls.forEach(function(el) { io.observe(el); });
  } else {
    revealEls.forEach(function(el) { el.classList.add('visible'); });
  }

  /* ---------- glitch reveal on name (once, after entrance) ---------- */
  if (!reduceMotion) {
    var h1 = document.getElementById('glitchName');
    setTimeout(function() {
      h1.classList.add('glitching');
      setTimeout(function() { h1.classList.remove('glitching'); }, 550);
    }, 1450);
  }

  /* ---------- hero parallax on scroll ---------- */
  var hero = document.querySelector('.hero');
  if (!reduceMotion) {
    window.addEventListener('scroll', function() {
      var y = window.scrollY;
      hero.style.transform = 'translateY(' + (y * 0.25) + 'px)';
      hero.style.opacity = Math.max(1 - y / 500, 0);
    }, { passive: true });
  }

  /* ---------- particle network canvas ---------- */
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var W, H;
  var mouse = { x: null, y: null, active: false };
  var PARTICLE_COUNT = window.innerWidth < 600 ? 45 : 90;
  var LINK_DIST = 130;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function initParticles() {
    particles = [];
    for (var i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.4 + 0.6
      });
    }
  }
  initParticles();

  window.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseleave', function() { mouse.active = false; });
  window.addEventListener('touchmove', function(e) {
    if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; }
  }, { passive: true });

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      if (mouse.active) {
        var dx = p.x - mouse.x, dy = p.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 140) {
          var force = (140 - dist) / 140;
          p.x += (dx / dist) * force * 1.2;
          p.y += (dy / dist) * force * 1.2;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,180,84,0.45)';
      ctx.fill();
    }

    for (var a = 0; a < particles.length; a++) {
      for (var b = a + 1; b < particles.length; b++) {
        var pa = particles[a], pb = particles[b];
        var ddx = pa.x - pb.x, ddy = pa.y - pb.y;
        var d = Math.sqrt(ddx * ddx + ddy * ddy);
        if (d < LINK_DIST) {
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.strokeStyle = 'rgba(255,180,84,' + (0.14 * (1 - d / LINK_DIST)) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(tick);
  }

  /* ---------- live clock (Hyderabad time) ---------- */
  var clockEl = document.getElementById('liveClock');
  if (clockEl) {
    function updateClock() {
      var time = new Date().toLocaleTimeString('en-IN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false, timeZone: 'Asia/Kolkata'
      });
      clockEl.textContent = time + ' · Hyderabad';
    }
    updateClock();
    setInterval(updateClock, 1000);
  }

  if (!reduceMotion) {
    requestAnimationFrame(tick);
  } else {
    canvas.style.display = 'none';
  }
})();
</script>
</body>
</html>
