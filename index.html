<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sreehari</title>
<meta name="description" content="Sreehari — i@sreeharis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --bg-raised: #101312;
    --panel: #0d100e;
    --fg: #dde3dd;
    --fg-dim: #5b665c;
    --fg-dimmer: #333a34;
    --amber: #ffb454;
    --amber-soft: rgba(255,180,84,0.12);
    --amber-dim: #7a5a2c;
    --line: #1c211d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh;
    background-image: linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 100% 3px;
  }

  /* ---------- background grid + glow ---------- */
  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 25%, black 10%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 55% at 50% 25%, black 10%, transparent 75%);
    opacity: 0.6;
    pointer-events: none;
  }

  .glow {
    position: fixed;
    top: -10%;
    left: 50%;
    translate: -50%;
    width: 900px;
    height: 500px;
    background: radial-gradient(closest-side, rgba(255,180,84,0.10), transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  main { position: relative; z-index: 1; }

  /* ---------- top status bar ---------- */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 720px;
    margin: 0 auto;
    padding: 1.6rem 1.5rem 0;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.04em;
  }
  .statusbar .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5fbf77;
    margin-right: 0.5em;
    box-shadow: 0 0 6px #5fbf77;
    animation: pulse 2.4s ease-in-out infinite;
  }

  /* ---------- hero ---------- */
  .hero {
    min-height: 88vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .welcome {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber-dim);
    margin-bottom: 0.9rem;
    opacity: 0;
    transform: translateX(-40px);
    animation: slide-in 1.1s ease-out 0.1s forwards;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--line);
    outline: 1px solid var(--amber-dim);
    outline-offset: 4px;
    margin-bottom: 1.6rem;
    opacity: 0;
    filter: grayscale(0.25) contrast(1.05);
    animation: rise 0.5s ease-out 1s forwards;
  }

  h1 {
    font-size: clamp(3rem, 11vw, 5.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    opacity: 0;
    animation: rise 0.5s ease-out 1.4s forwards;
  }
  h1 .cursor {
    display: inline-block;
    width: 0.45ch;
    margin-left: 0.15em;
    background: var(--amber);
    color: var(--amber);
    animation: blink 1s step-end infinite 1.9s;
  }

  .tagline {
    margin-top: 1rem;
    color: var(--fg-dim);
    font-size: 0.95rem;
    max-width: 40ch;
    opacity: 0;
    animation: rise 0.5s ease-out 1.8s forwards;
  }
  .tagline .amber { color: var(--amber-dim); }

  .scroll-cue {
    margin-top: 3rem;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 0.6em;
    opacity: 0;
    animation: rise 0.5s ease-out 2.2s forwards;
  }
  .scroll-cue::after {
    content: "";
    width: 1px;
    height: 22px;
    background: linear-gradient(var(--amber-dim), transparent);
    animation: drop 1.6s ease-in-out infinite;
  }

  /* ---------- connect section ---------- */
  .connect {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }

  .section-label {
    font-size: 0.7rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8em;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .cards {
    display: grid;
    gap: 0.9rem;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    padding: 1.3rem 1.4rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    text-decoration: none;
    color: var(--fg);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--amber-soft);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--amber-dim);
    transform: translateX(4px);
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card:focus-visible { outline: 1px solid var(--amber-dim); outline-offset: 2px; }

  .card .icon {
    font-size: 1.1rem;
    color: var(--amber);
    width: 1.6rem;
    text-align: center;
    z-index: 1;
  }
  .card .text { z-index: 1; }
  .card .label {
    font-size: 0.68rem;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }
  .card .value {
    font-size: 1rem;
    font-weight: 500;
  }
  .card .arrow {
    margin-left: auto;
    color: var(--fg-dimmer);
    z-index: 1;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .card:hover .arrow, .card:focus-visible .arrow {
    color: var(--amber);
    transform: translateX(3px);
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--fg-dimmer);
    letter-spacing: 0.03em;
    border-top: 1px solid var(--line);
  }
  footer div:first-child { padding-top: 1.5rem; }
  footer div:last-child { padding-top: 1.5rem; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @keyframes drop { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  @media (max-width: 480px) {
    .statusbar { font-size: 0.6rem; }
    .card { padding: 1.1rem 1.1rem; gap: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .tagline, .scroll-cue, footer, .avatar, .welcome {
      animation: none !important; opacity: 1 !important; width: auto !important; border-right: none !important;
    }
    h1 .cursor { animation: none !important; opacity: 1; }
    .statusbar .dot, .scroll-cue::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>

<main>
  <div class="statusbar">
    <span><span class="dot"></span>online</span>
    <span>sreeharis.com</span>
  </div>

  <section class="hero">
    <div class="welcome">Welcome</div>
    <img class="avatar" src="assets/sreehari.jpg" alt="Sreehari">
    <h1>Sreehari<span class="cursor">&nbsp;</span></h1>
    <p class="tagline">Personal corner of the internet at <span class="amber">sreeharis.com</span>.</p>
    <div class="scroll-cue">connect</div>
  </section>

  <section class="connect">
    <div class="section-label">reach me</div>
    <div class="cards">
      <a class="card" href="mailto:i@sreeharis.com">
        <span class="icon">@</span>
        <span class="text">
          <span class="label">email</span>
          <span class="value">i@sreeharis.com</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="card" href="https://instagram.com/realsreeharis" target="_blank" rel="noopener noreferrer">
        <span class="icon">#</span>
        <span class="text">
          <span class="label">instagram</span>
          <span class="value">@realsreeharis</span>
        </span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
  </section>

  <footer>
    <div>&copy; 2026 Sreehari</div>
    <div>built with care</div>
  </footer>
</main>
</body>
</html>
